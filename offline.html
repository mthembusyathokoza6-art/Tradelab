<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080a">
  <title>Offline — TradeLab</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#08080a;color:#f4f4f5}main{width:min(100%,460px);padding:32px;border:1px solid #29292d;border-radius:24px;background:#111113}.brand{display:flex;align-items:center;gap:10px;font-weight:750}.mark{width:34px;height:34px;border-radius:11px;background:#f4f4f5;display:grid;place-items:center}.mark:after{content:"";width:14px;height:14px;border-radius:4px;background:#08080a}h1{margin:28px 0 10px;font-size:34px;letter-spacing:-.04em}p{color:#a1a1aa;line-height:1.65}.note{margin-top:20px;padding:14px;border:1px solid #2b2b2f;border-radius:12px;background:#0c0c0e;color:#d4d4d8;font-size:13px}button{width:100%;min-height:48px;margin-top:24px;border:0;border-radius:999px;background:#f4f4f5;color:#08080a;font:inherit;font-weight:700;cursor:pointer}button:focus-visible{outline:3px solid #22c55e;outline-offset:3px}
  </style>
</head>
<body><main>
  <div class="brand"><span class="mark" aria-hidden="true"></span><span>TradeLab</span></div>
  <h1>You're offline.</h1>
  <p>Reconnect to load current account data, market prices, and trading features. The offline page does not store or submit trades.</p>
  <div class="note" id="status" role="status" aria-live="polite">Check your connection, then try again.</div>
  <button id="retry" type="button">Try again</button>
</main>
<script src="/offline.js" defer></script>
</body></html>
